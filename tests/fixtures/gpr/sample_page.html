<!--
  Synthetic GPR page fixture for tests/gpr/test_scrape.py.

  Mirrors the real lolesports.com/en-GB/gpr/{year} structure where it matters
  to the parser — Apollo SSR transport pushes embedded as JS literals — and
  exercises the parser edge cases:

    1. Two distinct payload shapes coexist on real pages:
         (a) events[*].value.data.teamGPR
         (b) rehydrate[<opaque-key>].data.teamGPR
       Both must yield team records.
    2. Apollo pushes are JS source, not JSON, and contain bare `undefined`
       literals that must be substituted to `null` before json.loads.
    3. Push payloads contain string literals with escaped quotes; the
       paren-balancing extractor must respect string state.
    4. The same (team_id, dateCalculated) snapshot can appear on multiple
       pages and must dedupe to a single row when values agree.

  Three teams (T_alpha, T_beta, T_gamma) populate the fixture:
    - T_alpha appears in BOTH push shapes with identical snapshots
      (dedupe-no-conflict path).
    - T_beta has an escaped-quote in its name.
    - T_gamma has an `undefined` field.
-->

<body>

(window[Symbol.for("ApolloSSRDataTransport")] ??= []).push({

    "ROOT_QUERY:teamGPR(year:2024)": {

        "teamGPR": [
